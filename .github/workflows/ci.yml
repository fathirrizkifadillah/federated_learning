name: CI — Build, Typecheck & ML Privacy Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api-and-web:
    name: Build API & Web (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared-types workspace
        run: npm run build --workspace=packages/shared-types

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: Build Express API
        run: npm run build:api

      - name: Type-check Next.js Web
        run: cd apps/web && npx tsc --noEmit

      - name: Build Next.js Web production bundle
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        run: npm run build:web

  ml-privacy-tests:
    name: ML & Privacy Invariant Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU-only PyTorch & ML test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install flwr numpy pandas scikit-learn scipy pyyaml pytest

      - name: Run ML & Federated Privacy Pytest Suite
        run: pytest ml/tests -v
