version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: fedsocial-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fedsocial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fedsocial_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fedsocial_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fedsocial} -d ${POSTGRES_DB:-fedsocial_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
